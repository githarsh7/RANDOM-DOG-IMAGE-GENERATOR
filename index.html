<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BARK — Random Dog Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="noise"></div>

  <header class="site-header">
    <span class="header-label">EST. 2026</span>
    <span class="header-title">DOG GENERATOR</span>
    <span class="header-label">RANDOM</span>
  </header>

  <main class="main">

    <div class="hero-type">
      <h1 class="hero-word">BARK</h1>
      <div class="hero-sub">
        <span class="tag">BREED UNKNOWN</span>
        <p>One click. One dog. No rules.</p>
      </div>
    </div>

    <div class="card-area">
      <div class="card" id="card">
        <div class="card-placeholder" id="placeholder">
          <span class="placeholder-text">AWAITING<br>DOGGO</span>
          <div class="placeholder-lines">
            <span></span><span></span><span></span>
          </div>
        </div>
        <img id="dogImg" alt="Random Dog" />
        <div class="breed-strip" id="breedStrip">
          <span class="breed-label">BREED</span>
          <span class="breed-name" id="breedName">—</span>
        </div>
      </div>

      <div class="side-info">
        <div class="counter-block">
          <span class="counter-num" id="counter">00</span>
          <span class="counter-label">dogs<br>fetched</span>
        </div>
        <div class="divider-line"></div>
        <p class="side-copy">Every dog is different. Every fetch is a surprise.</p>
        <div class="divider-line"></div>
        <span class="side-tag">dog.ceo API</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="fetch-btn" id="fetchBtn" onclick="getDog()">
        FETCH
      </button>
      <span class="btn-sub">pull a random dog from the internet</span>
    </div>

  </main>

  <footer class="site-footer">
    <span>WOOF WOOF WORLD</span>
    <span class="footer-dot"></span>
    <span>ALL BREEDS WELCOME</span>
    <span class="footer-dot"></span>
    <span>NO CATS</span>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
