<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PawPaw — Fetch a Dog</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="shell">

    <!-- LEFT PANEL -->
    <aside class="panel-left">
      <div class="brand">PAWPAW</div>

      <div class="headline-block">
        <p class="eyebrow">Random Dog Generator</p>
        <h1 class="headline">Every<br>fetch, a<br>new<br><em>friend.</em></h1>
      </div>

      <div class="fact-block" id="factBlock">
        <span class="fact-label">DOG FACT</span>
        <p class="fact-text" id="factTxt">Hit fetch — a dog fact will appear here.</p>
      </div>

      <div class="stat-row">
        <div class="stat">
          <span class="stat-n" id="countDisplay">0</span>
          <span class="stat-l">fetched</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-n">450+</span>
          <span class="stat-l">breeds</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-n">∞</span>
          <span class="stat-l">good boys</span>
        </div>
      </div>

      <div class="cta-block">
        <button class="fetch-btn" id="fetchBtn">
          <span id="btnTxt">Fetch a Dog</span>
          <svg class="btn-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M3 9h12M10 4l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

    </aside>

    <!-- RIGHT PANEL -->
    <main class="panel-right">

      <!-- breed tag -->
      <div class="breed-tag" id="breedTag">
        <span class="breed-dot"></span>
        <span id="breedVal">—</span>
      </div>

      <!-- image area -->
      <div class="img-frame" id="imgFrame">
        <div class="idle-state" id="idleState">
          <div class="idle-paw">🐾</div>
          <p class="idle-hint" id="idleHint">Awaiting fetch</p>
          <div class="spinner" id="spinner"></div>
        </div>
        <img id="dogImg" alt="A random dog"/>
      </div>

      <!-- bottom strip -->
      <div class="strip">
        <span class="strip-item">dog.ceo API</span>
        <span class="strip-sep">·</span>
        <span class="strip-item">Live fetch</span>
        <span class="strip-sep">·</span>
        <span class="strip-item" id="stripBreed">No breed yet</span>
      </div>

    </main>

  </div>

<script src="script.js"></script>
</body>
</html>
